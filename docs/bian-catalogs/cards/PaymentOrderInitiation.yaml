service_domain: PaymentOrderInitiation
control_record: PaymentOrderInitiationTransaction
descricao: This service domain provides a customer payment service. It captures the payer and payee details and other key properties of the payment and initiates the orchestration of the transaction. It provides support for repeating/scheduled payments.
arquivo_origem: PaymentOrderInitiation.yaml
versao_bian: 14.0.0
commit_bian: b58bf4c2c300dd018afc084e9bb24b7adaaa3500
behaviour_qualifiers: [ Compliance, Confirmation, OrderInitiation ]
