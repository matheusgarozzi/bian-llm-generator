service_domain: StandingOrder
control_record: StandingOrderFacility
descricao: Customers can issue standing orders to the bank. In most cases this is for the execution of a periodical payment, but there are other standing instructions like, sweeping balances at end of month, topping off excess funds for a current account, etc.
arquivo_origem: StandingOrder.yaml
versao_bian: 14.0.0
commit_bian: b58bf4c2c300dd018afc084e9bb24b7adaaa3500
behaviour_qualifiers: [ StandingOrderPayment ]
